# Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
# Use "127.0.0.1" or "localhost" to restrict access to local machine only.
host: ""

# Server port
port: 8317

# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
  enable: false
  cert: ""
  key: ""

# Management API settings
remote-management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (a key is still required).
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
  secret-key: ""

  # Optional custom path segment for management page, management API and OAuth callbacks.
  # Example: "my-random-path" moves them to /my-random-path/management.html,
  # /my-random-path/v0/management/... and /my-random-path/{provider}/callback.
  # Leave empty to keep the legacy fixed paths.
  access-path: ""

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # Disable automatic periodic background updates of the management panel from GitHub (default: false).
  # When enabled, the panel is only downloaded on first access if missing, and never auto-updated afterward.
  # disable-auto-update-panel: false

  # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
  panel-github-repository: "https://github.com/RoodraNambisa/Cli-Proxy-API-Management-Center"

  # Opt in to server-side filtering and pagination for the auth files management page.
  # This does not change startup loading or runtime scheduling of credentials.
  auth-files-pagination:
    enabled: false

  # Keep a redacted in-memory log ring and expose it through the authenticated
  # management SSE endpoint. This is independent of logging-to-file.
  live-logs:
    enabled: false

  # Controls authenticated management-only diagnostic detail. "full" keeps
  # non-credential upstream text, email addresses, paths, and ordinary URL
  # parameters. Tokens, cookies, passwords, private keys, assertions, recovery
  # codes, authorization parameters, and signed URLs are always hidden.
  diagnostics:
    detail-level: safe

# Authentication directory (supports ~ for home directory)
auth-dir: "~/.cli-proxy-api"

# API keys for authentication
api-keys:
  - "your-api-key-1"
  - "your-api-key-2"
  - "your-api-key-3"

# ChatGPT Web credentials are stored as 0600 JSON files under auth-dir.
# The management API can import Web OAuth refresh tokens, explicit ChatGPT
# session cookies, or access-token-only credentials. Codex-linked Web copies
# must be created through the conversion task and never copy the Codex refresh token.
# Automatic password re-login only applies to native credentials that retain
# password/TOTP material and is disabled by default.
chatgpt-web:
  auto-relogin: false
  # For credentials without complete password/TOTP material, allow a complete
  # ChatGPT session cookie to refresh an expired or rejected access token.
  # Definitive session expiry can mark the credential dead; network and
  # transient upstream failures never do.
  session-cookie-refresh-on-token-failure: false
  # Queue a background refresh for session-backed imports even when the uploaded
  # access token remains valid. Upload completion never waits for this refresh.
  force-session-refresh-on-import: true
  import:
    # Shared across all concurrent import tasks.
    workers: 4
    # Credentials use the built-in model catalog immediately. Enable this to
    # validate and replace it from /backend-api/models in the background.
    validate-models-after-upload: false
    # Requires account-info.auto-refresh-enabled; never performs a hidden query
    # when automatic account-info refresh is disabled.
    refresh-account-info-after-upload: false
  # Remove credentials only after ChatGPT Web confirms the account lifecycle is dead.
  auto-delete-dead-auths: false
  # Treat an exhausted Passkey-only recovery as permanently dead only when the
  # access token and every other refresh or login path are already unavailable.
  invalid-passkey-response-as-dead: false
  # When login_method is auto and no Passkey or password is available, allow a
  # persisted api798_url to supply an email OTP. Explicit login_method=api798
  # is not controlled by this fallback switch.
  api798-auto-login-enabled: false
  # Empty matches every priority; otherwise only exact integer priorities are removed.
  auto-delete-dead-priorities: []
  # The initial background login is followed by at most this many retries.
  auto-relogin-max-retries: 3
  # Apply symmetric jitter to retry delays to avoid synchronized login bursts.
  auto-relogin-jitter-percent: 20
  # Concurrent background automatic re-login workers. Reducing this value does
  # not cancel attempts that are already running.
  auto-relogin-workers: 4
  # Bound queued and running credential generations retained by automatic re-login.
  auto-relogin-queue-size: 4096
  # Concurrent management re-login operations, including durable asynchronous
  # operations. Requests above this limit fail immediately with retryable backpressure.
  # Recommended range: 1-512; larger positive values are accepted but increase resource pressure.
  manual-relogin-concurrency: 4
  # Browser timezone shared by text, search, image, and account-info requests.
  timezone: "Asia/Shanghai"
  # Omit this field to derive the current offset, including DST, from timezone.
  # timezone-offset-minutes: -480
  # ChatGPT Web does not return API token usage. Estimate visible input/output
  # text and supported image inputs/outputs locally after a successful response.
  # Disable this to skip the tokenizer work and return zero-valued usage fields.
  estimate-token-usage: true
  usage-cache:
    # Keep compact billing material in memory by default. When enabled, input
    # below the threshold is tokenized before body release and only numeric
    # counts remain; input at or above the threshold spills to disk and is
    # tokenized only after a successful terminal response.
    enabled: false
    disk-threshold-mb: 1
    max-disk-size-mb: 1024
    # Before spilling a large request, reserve enough real filesystem capacity.
    # The request is rejected with 503 without retrying or cooling a credential
    # when either projected threshold would be reached.
    resource-guard-enabled: true
    min-available-disk-mb: 1024
    max-filesystem-used-percent: 95
    # Remove lock-confirmed orphaned v2 instance directories during startup.
    # 0 deletes immediately; cleanup never scans periodically.
    orphan-retention-minutes: 0
    # Empty uses an instance-private directory under the system temporary path.
    path: ""
  image-usage:
    # Billing-only fallback for quality=auto; this does not change Web output quality.
    auto-output-quality: "medium"
    # Used only after a successful image request when token estimation is disabled
    # and the upstream response contains no image usage.
    fallback-usage:
      enabled: false
      input-text-tokens: 0
      input-image-tokens: 0
      output-text-tokens: 0
      output-image-tokens: 2000
  login-proxy:
    # Use this dynamic proxy only for initial, manual, and background password login.
    # Token/session refresh, quota refresh, and model requests keep their existing routing.
    enabled: false
    url-template: ""
    # Empty uses the URL-safe alphanumeric default. {N} placeholders are allowed
    # only inside proxy credentials and are expanded independently.
    placeholder-charset: ""
    rotate-on-retry: true
    request-attempts: 3
    flow-attempts: 2
    retry-delay-milliseconds: 800
    acquisition-timeout-seconds: 90
  account-info:
    # Disable event-triggered account/profile and image quota refreshes.
    # Manual force refreshes remain available; TTL only controls reuse after a refresh is triggered.
    auto-refresh-enabled: true
    # Keep up to 100 de-duplicated, safe account-info failures in memory.
    # Response bodies, credentials, cookies, account identity, and proxy URLs are never retained.
    diagnostics-enabled: false
    # Keep the latest raw conversation/init quota response per credential in
    # bounded memory for debugging. Never written to logs or credential files.
    raw-quota-response-enabled: false
    # Bounded workers refresh account plan and image quota only when requested,
    # when a quota recovery is due, or after an image quota error.
    refresh-workers: 4
    refresh-queue-size: 256
    refresh-ttl-minutes: 15
    # 0 disables periodic scans. Positive values scan every eligible ChatGPT Web
    # credential while still respecting the refresh TTL.
    periodic-refresh-minutes: 0
    recovery-jitter-seconds: 30
    # Number of retries after the initial failed refresh.
    max-retries: 3
  sentinel:
    # Local remains the default. Empty scopes means no remote computation.
    mode: local
    remote:
      scopes: [images] # Other supported scopes: chat, login.
      budget-seconds: 30 # Cumulative RPC/queue/compute time per challenge round.
      nodes: [] # Each item: {name: solver-1, url: https://solver.example.com, api-key: ...}
    # Data-only compatibility rules for new page properties. Changes apply to
    # new conversation requests; current collector/snapshot pairs keep their rules.
    go-vm-compatibility:
      enabled: false
      # Preserve simple values actually written by the Observer to __oai_so_*.
      observer-state-auto-extend: true
      # Additional exact window property names; never supply UUID values here.
      writable-window-properties: []
      # New read-only properties: path, type, value, enumerable (default false).
      # Types: string, boolean, number, null, undefined (omit value for undefined).
      # Built-in properties, persona fields, methods and credentials are protected.
      environment-properties: []
    # Keep the Go VM on the hot path and lazily fetch the versioned SDK from the
    # official OpenAI HTTPS endpoint only when required. Bootstrap SRI is enforced
    # when present; set false if remote JavaScript execution is not acceptable.
    sdk-runtime-enabled: true
    # 0 automatically uses max(1, min(4, (GOMAXPROCS+1)/2)); 16 is the
    # recommended manual starting point. Larger values are accepted but may
    # increase QuickJS CPU and memory usage under compatibility fallback load.
    sdk-workers: 0
    # 0 disables waiting when every SDK worker is busy.
    sdk-queue-size: 32
    # Number of SDK source and bytecode versions retained in memory.
    sdk-cache-versions: 3

# Computation shares the main host/port and TLS; can also run with --sentinel-solver-only.
# This service never loads account credentials or calls authenticated official APIs.
sentinel-solver:
  enabled: false
  access-path: "/v1/sentinel" # Custom endpoint, e.g. /afhkajf/Sentinel. Restart to change the path. Not a replacement for authentication or HTTPS.
  api-keys: [] # Separate from management credentials; required when enabled.
  sdk-fallback-enabled: false
  go-vm-compatibility:
    enabled: false
    observer-state-auto-extend: true
    writable-window-properties: []
    environment-properties: []
  go-workers: 0
  queue-size: 64
  max-sessions: 128
  memory-budget-mib: 512 # Conservative admission reservation, not an RSS limit.
  sdk-workers: 0
  sdk-queue-size: 32
  sdk-cache-versions: 3
  session-idle-seconds: 120
  drain-timeout-seconds: 120

# Optional provider and credential-priority restrictions for client API keys.
# Empty allow/exclude lists preserve unrestricted priority routing. Exclusions always win.
# Priority 0 includes credentials without an explicit priority; negative priorities are supported.
# Values must be exact integers in [-9007199254740991, 9007199254740991]; invalid saves are rejected.
# New logical requests capture updated restrictions; retries keep their initial snapshot.
# A restricted key never falls back to priorities outside its allowed set.
# Provider IDs are matched exactly after trimming and lowercasing; use "xai" for Grok credentials.
# api-key-groups:
#   - api-key: "your-api-key-1"
#     name: "Work" # Optional display name; empty means unnamed, up to 100 Unicode characters, no control characters.
#     providers: ["codex", "xai"]
#     allowed-priorities: [1, 2]
#     excluded-priorities: [2]

# Enable debug logging
debug: false

# Enable pprof diagnostics. Management endpoints are exposed behind /v0/management/pprof/*.
# The optional standalone pprof HTTP server uses addr; keep it bound to localhost for safety.
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# When true, disable high-overhead HTTP middleware features to reduce per-request memory usage under high concurrency.
commercial-mode: false

# When true, write application logs to rotating files instead of stdout
logging-to-file: false

# Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
# files are deleted until within the limit. Set to 0 to disable.
logs-max-total-size-mb: 0

# Remove inactive log files older than this many days. Set to 0 to disable age-based cleanup.
logs-retention-days: 0

# Maximum number of error log files retained when request logging is disabled.
# When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
error-logs-max-files: 10

# When false, disable in-memory usage statistics aggregation
usage-statistics-enabled: false

# When in-memory usage collection is enabled, independently control snapshot restore and writes.
# Set to false to ignore existing snapshots and disable all automatic snapshot writes.
usage-statistics-persistence-enabled: true

# How often to persist usage statistics to the logs directory.
# Set to 0 to restore at startup and persist only during graceful shutdown.
usage-statistics-persist-interval-seconds: 0

# Remove request detail rows older than this many days before persistence.
# Set to 0 to retain details without a time limit.
usage-statistics-detail-retention-days: 0

# Limit the persisted Usage snapshot by removing oldest detail rows first.
# Set to 0 to disable the snapshot size limit.
usage-statistics-max-storage-megabytes: 0

# Shared USD prices per one million tokens for server-side usage cost reports.
# Model names are matched exactly after trimming and converting to lowercase.
usage-pricing:
  models:
#    gpt-5.4:
#      input-per-million: 1.25
#      output-per-million: 10
#      cached-input-per-million: 0.125

# Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
# Per-entry proxy-url also supports "direct" or "none" to bypass both the global proxy-url and environment proxies explicitly.
proxy-url: ""

# Optional structured proxy pools. Port ranges stay compact and are selected when a credential is bound.
# A {N} placeholder in proxy credentials is expanded once per binding with N URL-safe random characters.
# proxy-pools:
#   - name: "residential"
#     placeholder-charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
#     check-interval-seconds: 300
#     bind-attempts: 3
#     spread-bindings: false # Prefer unused entry/port/placeholder bindings without probing exit IPs.
#     entries:
#       - id: "home"
#         url-template: "socks5h://user:pass@10.0.0.6"
#         ports: "3334,3336-6000"
#       - id: "geo"
#         url-template: "http://user-session-{9}:pass@geo.example:18080"

# Shared settings for scheduled and management proxy health checks.
# proxy-health-check:
#   concurrency: 8 # Global limit shared by scheduled rounds and management checks.
#   endpoint-timeout-seconds: 8 # Complete-request timeout for each endpoint attempt.
#   failure-threshold: 1 # Consecutive failed probes before a previously usable node is isolated.
#   endpoints:
#     - name: "cloudflare"
#       url: "https://cloudflare.com/cdn-cgi/trace"
#       mode: "cloudflare-trace" # cloudflare-trace or http-status
#     # Endpoints are tried in order; any success completes the probe.

# Ordered proxy rules. The first rule matching both provider and priority wins.
# Targets with a higher priority are tried first. Equal-priority targets are balanced by normalized load.
# A matched rule never falls back to the global proxy or an undeclared direct connection.
# proxy-rules:
#   - name: "web-and-codex"
#     targets:
#       - pool: "residential"
#         priority: 10
#       - pool: "backup"
#         priority: 5
#       - direct: true
#         priority: 0
#     providers: ["chatgpt-web", "codex"]
#     priorities: [0, -1] # Credential priorities, unrelated to target priority.

# When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
force-model-prefix: false

# When true, forward filtered upstream response headers to downstream clients.
# Default is false (disabled).
passthrough-headers: false

# Number of additional request rounds after retryable execution failures.
# Each request round targets the next lower credential priority when available.
request-retry: 3

# Individual Gemini, Interactions, Claude, Codex and Vertex API key entries can
# override request-retry (0..2147483647). OpenAI-compatibility sets it on the provider.
# Omit the option or set null to inherit; legacy negative values act as zero.
# Zero permits the initial round only; same-round credential failover still follows
# the configured credential limit. Changing an override does not change credential IDs.
# Global settings are captured at request entry; credential overrides are checked
# from the current credential snapshot at each selection.

# Maximum number of different credentials to try in each request round.
# Set to 0 to try all available credentials in the current target priority.
max-retry-credentials: 0

# Maximum wait time in seconds for current target-priority cooldown recovery before moving to the next request round.
max-retry-interval: 30

# When true, disable auth/model cooldown scheduling globally (prevents blackout windows after failure states).
disable-cooling: false

# HTTP status codes that should record the failure without scheduling auth/model cooldowns.
no-cooldown-status-codes: []

# Custom cooldowns for stable upstream errors. scope can be "model" or "auth".
# status-code is optional; omit it or set 0 to match by message only.
# At least one of status-code or message-contains must be set.
fixed-error-cooldowns:
  - status-code: 401
    message-contains: "Your authentication token has been invalidated."
    cooldown-seconds: 2592000
    scope: auth

# Rewrite selected final client-facing errors after retry and cooldown decisions.
# Rules cover runtime, local conversion, and cache errors, but not request validation
# or provider-key restrictions. Rules are evaluated in order.
# Omit status-code or set it to 0 when one message can use multiple original statuses.
# error-response-rewrites:
#   - sources:
#       - chatgpt-web
#       - codex
#     auth-priorities:
#       - 0
#       - -1
#     status-code: 429
#     message-contains: "maximum context"
#     response-status-code: 400
#     response-body:
#       error:
#         message: "Request context exceeds the model limit."
#         type: "invalid_request_error"
#         code: "context_too_large"

# Stable request errors that should not retry another credential or request round.
# Set to [] to disable the default image_generation_user_error invalid_value/moderation_blocked rules.
non-retryable-errors:
  - status-code: 400
    type: image_generation_user_error
    code: invalid_value
  - status-code: 400
    type: image_generation_user_error
    code: moderation_blocked

# Optional OAuth provider error actions. Empty rules are inactive; no enable switch.
# Credential request-scoped-errors override the provider list when nonempty.
# Valid status: 100-599. Actions: stop, stop-and-cooldown, continue, continue-and-cooldown.
# The first matching rule wins; match and match-regexr are OR conditions.
# Literal whitespace/case is preserved. Invalid rules reject the new configuration.
# Changes apply to new requests; cancellation, policy refusal, committed output,
# non-replayable requests and explicit no-cooling constraints remain authoritative.
oauth-request-scoped-errors: {}
# oauth-request-scoped-errors:
#   codex:
#     - status: 400
#       match: ["example upstream error"]
#       match-regexr: ['^example error [0-9]+$']
#       action: stop

# Remove route models from matching credentials before model prefixing and registry registration.
# Matching fields use non-secret auth metadata only.
auth-model-exclusions: []
# auth-model-exclusions:
#   - models: ["gpt-image-2"]
#     priorities: [-1, 0]
#   - models: ["gpt-image-2"]
#     keyword-contains: ["free", "trial"]
#   - models: ["-all", "+gpt-5.5"]
#     priorities: [-1]
#   - disable-image-generation: true
#     priorities: [-1]
#   - disable-image-generation: true
#     keyword-contains: ["free", "trial"]

# How to handle regular Codex text requests when a matched credential has image generation disabled
# but the request body still carries an image_generation tool. Valid values: remove, error.
disabled-image-generation-tool-fallback: false
disabled-image-generation-tool-action: remove
disabled-image-generation-tool-error:
  status-code: 400
  message: "image_generation tool is disabled for this credential"
  type: image_generation_disabled
  code: image_generation_disabled

# Release retained request body copies after a request has been waiting for N seconds.
# log-only=true only drops request log/upstream log copies and does not affect retries.
# log-only=false drops replay payload references and disables credential/model/request retries.
request-body-release:
  enable: false
  log-only: false
  after-seconds: 0
  min-body-bytes: 0

# Block API requests when the raw request body contains configured byte keywords.
# Matching is performed on raw request bytes before provider routing.
request-body-audit:
  enable: false
  keywords: []
  # Base64-encoded raw byte keywords for binary-safe matching.
  keywords-base64: []
  # false means case-insensitive matching after byte-level lowercasing.
  case-sensitive: false
  # 0 means read the full request body for auditing.
  max-body-bytes: 0
  # When max-body-bytes > 0, reject requests larger than that limit instead of scanning only the prefix.
  reject-oversize: true
  error:
    status-code: 400
    message: "Request body was rejected by policy."
    type: "invalid_request_error"
    code: "request_body_blocked"

# Core auth auto-refresh worker pool size (OAuth/file-based auth token refresh).
# When > 0, overrides the default worker count (16).
# auth-auto-refresh-workers: 16

# Quota exceeded behavior
quota-exceeded:
  switch-project: true # Whether to automatically switch to another project when a quota is exceeded
  switch-preview-model: true # Whether to automatically switch to a preview model when a quota is exceeded
  antigravity-credits: true # Whether to retry Antigravity quota_exhausted 429s once with enabledCreditTypes=["GOOGLE_ONE_AI"]

# Optional background handling for broken or repeatedly rate-limited auth files.
auth-maintenance:
  enable: false
  scan-interval-seconds: 30
  delete-interval-seconds: 5
  delete-status-codes: []
  disable-status-codes: [401]
  delete-quota-exceeded: false
  quota-strike-threshold: 6
  disable-quota-exceeded: false
  disable-quota-strike-threshold: 6

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "round-robin" # round-robin (default), fill-first, random, weighted-round-robin
  # Weighted routing reads each credential's optional weight: absent = 1,
  # integer range 0..1000000; legacy negative integers act as 0. Zero excludes
  # the credential only in weighted routing. Other strategies ignore weights.
  # Configure weight on each API-key entry or in an OAuth credential JSON file.
  # Strategy choices are fixed per logical request; credential edits apply on
  # the next selection attempt. Capacity and credential retirement stay live.
  fill-first-range: 1 # fill-first only; N credentials per fill group, group-internal random
  fill-first-per-auth-rpm: 0 # fill-first only; 0 disables; mutually exclusive with fill-first-range > 1
  per-auth-request-limit: 0 # all strategies; 0 disables the generic per-auth fixed-window limit
  per-auth-request-window-minutes: 1 # UTC-aligned fixed window; minimum 1 minute
  # A positive generic limit takes precedence over fill-first-per-auth-rpm at the same priority.
  # Optional per-priority overrides. These take precedence over routing.strategy
  # and the global max-retry-credentials for the matching priority.
  # max-retry-credentials counts the first credential in the round; 1 means no
  # same-priority credential retry, and 0 means try all available credentials.
  priority-overrides: []
  # Example:
  # priority-overrides:
  #   - priority: 0
  #     strategy: fill-first
  #     fill-first-range: 5
  #     # fill-first-per-auth-rpm: 60 # alternatively, sequentially move to next auth after 60 selections/minute
  #     per-auth-request-limit: 120
  #     per-auth-request-window-minutes: 5
  #     # Optional provider/plan refinements. Empty providers match every provider.
  #     # Each field independently inherits from this priority, then from global routing.
  #     subscription-overrides:
  #       - providers: [codex]
  #         plan-types: [pro]
  #         per-auth-request-limit: 180
  #       - plan-types: [plus]
  #         per-auth-request-limit: 60
  #         per-auth-request-window-minutes: 10
  #     max-retry-credentials: 2
  #   - priority: -1
  #     strategy: random
  #     max-retry-credentials: 1
  # Enable universal session-sticky routing for all clients.
  # Session IDs are extracted from: metadata.user_id, X-Session-ID,
  # Session-Id/Session_id, X-Client-Request-Id, conversation_id, prompt_cache_key, or message hash.
  # Explicit session identifiers take precedence over the client cache key.
  # Cache-key affinity does not require codex.passthrough-prompt-cache-key.
  session-affinity: false # default: false
  # Allow initial-message hashes and conversation-prefix inference when explicit
  # session IDs/cache keys are absent. False uses the configured routing strategy
  # without deriving affinity from message history, even if session-affinity-lcp
  # remains configured. Explicit identities and WebSocket bindings are unchanged.
  session-affinity-use-history: true # default: true; hot reload affects new requests
  # Keep an eligible existing binding when a higher-priority credential recovers.
  # Requires session affinity. Cold selection and failover still follow priority.
  # Boolean only; hot reload applies to new requests, not in-flight routing policy.
  session-affinity-across-priorities: false
  # Prefer an eligible parent's credential for explicit subagents and forks
  # without an existing binding. Requires session-affinity and a trusted caller
  # scope. Boolean only, default false; hot reload affects new requests only.
  session-affinity-subagents: false
  # Infer a credential preference from a complete shared conversation prefix
  # when no reliable client session ID exists. Requires session-affinity and a
  # trusted caller scope; shared system/tool templates alone never match.
  # Boolean only, default false; hot reload affects new requests only.
  session-affinity-lcp: false
  # Allow a bound session to move to another credential when the bound credential
  # is unavailable or the request fails. Set false for strict sticky sessions.
  session-affinity-failover: true # default: true
  # How long session-to-auth bindings are retained. Default: 1h
  # Unrelated updates, request limits and priority overrides retain bindings.
  # Changing the selector or affinity settings starts a new binding cache;
  # in-flight requests keep their earlier selector and policy.
  session-affinity-ttl: "1h"

# When true, enable authentication for the WebSocket API (/v1/ws).
ws-auth: false

# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0
# OpenAI Images API compatibility backed by Codex Responses image_generation tool.
# images:
#   codex-model: "gpt-5.4"          # Outer Responses model used to invoke the image tool.
#   image-model: "gpt-image-2"      # Default when the request omits model; retained for older configurations.
#   codex-request-timeout-seconds: 0 # Logical image request budget for Codex tool/native paths (0 disables; 1-86400 seconds). Retries and n share one start time.
#   image-models: ["gpt-image-2", "gpt-image-2.5", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst"] # Codex tool models; the requested model is forwarded, not rotated.
#   enable-free-plan-image-model: false # Allow Codex free-plan auths to register/use the image model.
#   enable-n-aggregation: false     # Split n > 1 into multiple Codex image calls and aggregate results.
#   unsupported-status-code: 400    # Status code for unsupported image options such as response_format=url.
#   override-response-format-url: false # Coerce response_format=url to b64_json.
#   response-format-url-data-url: false # Return data: URLs for response_format=url instead of rejecting it.
#   override-transparent-background: false # Coerce background=transparent to auto.
#   override-input-fidelity: false # Omit input_fidelity instead of forwarding it.
#   override-unsupported-params: false # Legacy shortcut for enabling supported override options above.
#   enable-stream-flush: true        # Allow image stream flush batching. Uses image or global streaming thresholds.
#   stream-flush-interval-ms: 0      # Image-specific flush interval. 0 falls back to streaming.stream-flush-interval-ms.
#   stream-flush-min-bytes: 0        # Image-specific byte threshold. 0 falls back to streaming.stream-flush-min-bytes.
#   chatgpt-web:
#     upstream-model: "auto"       # Web conversation router used with picture_v2; explicit saved values are preserved.
#     image-models: ["gpt-image-2", "gpt-image-2.5", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst"] # Independent public aliases, not upstream image engine selectors. All share quota.
#     remote-image-url-enabled: false # Fetch public HTTP(S) image_url inputs with SSRF and 50 MiB safeguards.
#     remote-image-url-download-mode: direct # direct or credential-proxy; missing credential proxy falls back to direct.
#     ignore-unsupported-params: false # Drop unsupported size/quality/etc. instead of excluding Web routing.
#     normalize-mismatched-image-mime: false # Trust supported image bytes when the declared MIME type is wrong.
#     normalize-remote-image-mime: true # Also normalize downloaded remote images when MIME normalization is enabled.
#     sanitize-error-responses: false # Hide Web provider, task, poll, and internal failure details from public image errors.
#     auto-cleanup-library-on-full: false # Destructive opt-in: after an upload storage rejection, recheck capacity and clear this account's owned first-party files in the background. Never empties trash or resubmits an image.
#     adapt-size-to-aspect-ratio: false # Map compatible explicit WxH sizes to an exact canvas/aspect-ratio prompt.
#     strict-size: false                # Exclude Web when an explicit size cannot be adapted; requires adaptation.
#     aspect-ratio-max-error-percent: 1 # Maximum relative error accepted for the generated output ratio.
#     max-resize-edge-pixels: 3840     # Ignore Web size adaptation when either requested edge exceeds this value.
#     resize-to-requested-size: false  # Center-crop and resize matched Web results to the requested WxH.
#     resize-filter: "catmull-rom"     # catmull-rom for quality, or approx-bilinear for throughput.
#     max-image-response-megabytes: 128 # Maximum compressed image bytes returned by one request.
#     max-n: 1                          # Maximum images in one logical ChatGPT Web image request (1-10).
#     max-in-flight: 64                 # Complete Web image attempts, including sleeping polls (recommended: 1-4096).
#     admission-queue-size: 64          # Bounded pre-upstream waiters; excess requests fail fast (recommended: 0-4096).
#     admission-wait-milliseconds: 1000 # Maximum local admission wait before a retryable 503 (recommended: 0-30000 ms).
#     max-finalizers: 8                 # Settled staging tasks (recommended: 1-64), separate from memory-finalizer-concurrency.
#     completion-reserve-megabytes: 1   # Per-attempt memory reserved before upstream work (recommended: 0-32 MiB).
#     memory-capacity-megabytes: 512    # Shared process-wide working set (recommended: 64-8192 MiB); independent of GOMEMLIMIT.
#     poll-concurrency: 64              # Concurrent poll HTTP requests (recommended: 1-512); sleeping tasks hold no slot.
#     poll-stall-breaker-enabled: true  # Reject new Web image attempts when every poll slot stops completing requests.
#     poll-stall-seconds: 120           # Full-slot no-completion interval before the breaker opens (30-3600 seconds).
#     request-timeout-seconds: 0       # Total Web image budget including queues, requirements, upload, stream, poll, download and processing. 0 disables; 1-86400 seconds. Hot reload affects new requests only. Expiry cancels work and defaults to 504; the upstream may still finish the image.
#     bootstrap-timeout-seconds: 0     # Homepage GET attempt budget including redirects and body reads. 0 disables; 1-3600 seconds. Suggested opt-in: 30.
#     bootstrap-retries: 0             # Extra homepage attempts on transient network failures, 0-5. Suggested opt-in: 1. Exhaustion allows normal credential failover; all attempts share the image request budget.
#     memory-finalizer-concurrency: 1   # Disk-spooled heavy finalizers (recommended: 1-64), also bounded by staging and memory.
#   native:
#     generations:
#       enabled: false             # Codex only; compatible Web credentials remain eligible.
#       models: ["gpt-image-2", "gpt-image-1.5", "gpt-image-2.5", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst"]
#       param-rules: []              # Native-only rules. "n" deletes, "n=1" overrides, JSON values keep JSON types.
#       unsupported-model-status-code: 400
#       unsupported-model-message: "Native image generation is not enabled for model {model}"
#     edits:
#       enabled: false             # Codex only; compatible Web credentials remain eligible.
#       models: ["gpt-image-2", "gpt-image-1.5", "gpt-image-2.5", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst"]
#       param-rules: []
#       unsupported-model-status-code: 400
#       unsupported-model-message: "Native image edit is not enabled for model {model}"
# Streaming behavior (SSE keep-alives + safe bootstrap retries).
# streaming:
#   keepalive-seconds: 15            # SSE heartbeats and WebSocket Ping. Default: 0 (disabled).
#                                  # Positive range: 1..9223372036 seconds; <= 0 or overflow disables.
#                                  # WebSocket turns snapshot the interval; reload affects the next turn.
#   bootstrap-retries: 1             # Default: 0 (disabled). Retries before first byte is sent.
#   enable-stream-flush: false       # Batch regular non-image stream flushes when true.
#   stream-flush-interval-ms: 0      # Batch regular stream flushes for up to N ms. 0 disables time batching.
#   stream-flush-min-bytes: 0        # Flush regular streams after N pending bytes. 0 disables byte batching.
#   trust-upstream-sse: false        # Skip OpenAI Responses SSE repair/validation and forward upstream frames directly.

# Signature cache validation for thinking blocks (Antigravity/Claude).
# When true (default), cached signatures are preferred and validated.
# When false, client signatures are used directly after normalization (bypass mode for testing).
# antigravity-signature-cache-enabled: true

# Bypass mode signature validation strictness (only applies when signature cache is disabled).
# When true, validates full Claude protobuf tree (Field 2 -> Field 1 structure).
# When false (default), only checks R/E prefix + base64 + first byte 0x12.
# antigravity-signature-bypass-strict: false

# Gemini API keys
# gemini-api-key:
#   - api-key: "AIzaSy...01"
#     prefix: "test" # optional: require calls like "test/gemini-3-pro-preview" to target this credential
#     base-url: "https://generativelanguage.googleapis.com"
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gemini-2.5-flash" # upstream model name
#         alias: "gemini-flash"    # client alias mapped to the upstream model
#     excluded-models:
#       - "gemini-2.5-pro"     # exclude specific models from this provider (exact match)
#       - "gemini-2.5-*"       # wildcard matching prefix (e.g. gemini-2.5-flash, gemini-2.5-pro)
#       - "*-preview"          # wildcard matching suffix (e.g. gemini-3-pro-preview)
#       - "*flash*"            # wildcard matching substring (e.g. gemini-2.5-flash-lite)
#   - api-key: "AIzaSy...02"

# Native Google Interactions API keys
# These keys use the native Interactions upstream for the dual Interactions routes and compatible translated entry protocols.
# Regular gemini-api-key entries continue to use generateContent/streamGenerateContent upstreams.
# interactions-api-key:
#   - api-key: "AIzaSy...03"
#     prefix: "native" # optional: require calls like "native/gemini-3-pro-preview" to target this credential
#     base-url: "https://generativelanguage.googleapis.com"
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gemini-2.5-flash" # upstream model name
#         alias: "native-gemini-flash" # client alias mapped to the upstream model
#     excluded-models:
#       - "gemini-2.5-pro"

# Native Grok API keys use the public API by default, independently of OAuth.
# Existing OAuth credential files and their per-model routes stay separate.
# xai-api-key:
#   - api-key: "YOUR_XAI_API_KEY"
#     base-url: "https://api.x.ai/v1"
#     prefix: ""
#     priority: 0
#     proxy-url: ""
#     headers: {}
#     models:
#       - name: "grok-4.6"
#         alias: "grok"
#     excluded-models: []
# With identity policies enabled, config keys keep random identity seeds under
# auth-dir/.xai-identities. Preserve this directory across server restarts.

# Grok global resource headers and policies. Credential custom headers win.
# OAuth acquisition uses separate login headers. Model override and identity
# headers are controlled by the final model and the policies below.
xai:
  # Preserve literal custom header values by default. When enabled, $HeaderName
  # reads a captured client header and $CPA-SESSION-ID uses the shared session
  # fingerprint. Missing sources are omitted; identity policies still take priority.
  dynamic-headers: false
  # Responses image_generation tool policy: remove (default), error, or allow.
  # allow requires Grok 4.6+ (excluding the older grok-4.20-* product line).
  # This policy does not affect the independent image generation endpoints.
  image-generation-tool-policy: remove
  # Incoming Chat Completions: responses converts to /responses (default);
  # direct preserves Chat format and uses the selected model node's /chat/completions.
  # The selected node/model must support Chat. Responses requests are unaffected.
  chat-completions-mode: responses
  # Default endpoint when no model route matches. An explicit credential
  # base_url overrides this default, including https://api.x.ai/v1.
  # Choices: cli, api, us-east-1, us-west-2, eu-west-1.
  # This selects an address; it does not grant upstream account permissions.
  # WebSocket and compact requests use the API when the chosen endpoint is CLI.
  default-base-url-mode: "cli"
  # Empty: query the credential's default node. Up to 8 sources, each cached
  # independently; use [cli, api] to merge both directories without duplicates.
  # Sources accept cli, api, us-east-1, us-west-2, eu-west-1, default, or an
  # HTTP(S) base URL. Directory membership does not choose the request route.
  model-catalog-sources: []
  # Credential xai_model_routes > global model-routes > credential base_url >
  # global default. Exact matches win over wildcard matches within each scope;
  # ties use list order. Rules match upstream model IDs after alias resolution.
  # Exact IDs can register models omitted by a catalog; wildcards cannot.
  # Credentials may override sources with xai_model_catalog_sources; empty
  # arrays inherit globals. A route to default bypasses global model rules.
  model-routes: []
  # Example: grok-4.5/4.6 use the CLI; other registered models use the API.
  # model-routes:
  #   - models: [grok-4.5, grok-4.6]
  #     upstream: cli
  #   - models: ["*"]
  #     upstream: api
  header-defaults:
    user-agent: "" # Built-in: xai-grok-workspace/0.2.120
    client-version: "" # Built-in: 0.2.120
    client-identifier: "" # Built-in: grok-shell
  headers: {}
  passthrough-client-identity: false
  spoof-session-identity: false
  session-identity-convergence: false
  session-identity-pool-size: 4 # 1-64; resizing reassigns sessions.
  identity-confuse: false
  # Only fills omitted client parameters; payload override rules still apply.
  # Empty defaults do not add reasoning effort or parallel tool calls.
  # Supported: max_output_tokens, reasoning.effort, temperature, top_p,
  # tool_choice, parallel_tool_calls and stream_tool_calls.
  request-defaults: {}
  # Hosted search injection applies to Responses, not direct Chat Completions.
  inject-web-search: false
  inject-x-search: false
  # Passthrough protects explicit session, conversation and cache fields.
  # Other identities derive from a persistent per-credential random seed.
  # Slots never share websocket state or conversation history.
  # History inference follows routing.session-affinity-use-history.

# Codex API keys
# All configured API key model lists accept optional catalog declarations:
# display-name: human-readable label; blank inherits the existing catalog name.
# max-context-length: integer from 0 to 2147483647; 0 or omission inherits the
# upstream model's catalog window. Invalid values reject the configuration.
# Changes apply to later catalog queries without retiring credentials or clearing
# their cooldowns. These declarations do not increase actual upstream capacity.
# thinking: optional capability object; omission/null inherits the catalog
# (OpenAI compatibility keeps its existing low/medium/high default).
# Example: thinking: {levels: [low, medium, high, xhigh]}
# Budget models: thinking: {min: 1024, max: 32768, zero-allowed: true, dynamic-allowed: true}
# Budgets require 0 <= min <= max <= 2147483647; 0/0 declares no budget range.
# Valid levels: none, minimal, low, medium, high, xhigh, max, auto. Empty lists
# are allowed; names are normalized only in runtime snapshots. Invalid types,
# ranges or levels reject saves; declarations cannot add upstream capabilities.
# is-compat: optional boolean, default false (null also disables); other types are rejected.
# Applies to API-key model mappings for Codex, Claude, Gemini, Interactions and Vertex.
# OpenAI compatibility already preserves assistant thinking text without this option.
# Preserves compatibility thinking/signature blocks. Codex agent_message conversion also requires optimize-multi-agent-v2.
# Thinking and compatibility changes apply to new credential attempts;
# existing attempts retain their selected model snapshot.
# API key entries also accept request-scoped-errors with the rule format above.
# For OpenAI compatibility, put the rules on the provider entry.
# codex-api-key:
#   - api-key: "sk-atSM..."
#     prefix: "test" # optional: require calls like "test/gpt-5-codex" to target this credential
#     base-url: "https://www.example.com" # use the custom codex API endpoint
#     # Boolean, default false. Enable only when this endpoint supports /alpha/search.
#     # Changes apply to later requests after reload; OAuth search needs no opt-in.
#     # Credential edits retain the existing retirement and in-flight cancellation rules.
#     alpha-search: false
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gpt-5-codex"   # upstream model name
#         alias: "codex-latest" # client alias mapped to the upstream model
#     excluded-models:
#       - "gpt-5.1"         # exclude specific models (exact match)
#       - "gpt-5-*"         # wildcard matching prefix (e.g. gpt-5-medium, gpt-5-codex)
#       - "*-mini"          # wildcard matching suffix (e.g. gpt-5-codex-mini)
#       - "*codex*"         # wildcard matching substring (e.g. gpt-5-codex-low)

# Claude API keys
# claude-api-key:
#   - api-key: "sk-atSM..." # use the official claude API key, no need to set the base url
#   - api-key: "sk-atSM..."
#     prefix: "test" # optional: require calls like "test/claude-sonnet-latest" to target this credential
#     base-url: "https://www.example.com" # use the custom claude API endpoint
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "claude-3-5-sonnet-20241022" # upstream model name
#         alias: "claude-sonnet-latest"      # client alias mapped to the upstream model
#     excluded-models:
#       - "claude-opus-4-5-20251101" # exclude specific models (exact match)
#       - "claude-3-*"               # wildcard matching prefix (e.g. claude-3-7-sonnet-20250219)
#       - "*-thinking"               # wildcard matching suffix (e.g. claude-opus-4-5-thinking)
#       - "*haiku*"                  # wildcard matching substring (e.g. claude-3-5-haiku-20241022)
#     cloak:                         # optional: request cloaking for non-Claude-Code clients
#       mode: "auto"                 # "auto" (default): cloak only when client is not Claude Code
#                                    # "always": always apply cloaking
#                                    # "never": never apply cloaking
#       strict-mode: false           # false (default): prepend Claude Code prompt to user system messages
#                                    # true: strip all user system messages, keep only Claude Code prompt
#       sensitive-words:             # optional: words to obfuscate with zero-width characters
#         - "API"
#         - "proxy"
#       cache-user-id: true          # optional: default is false; set true to reuse cached user_id per API key instead of generating a random one each request
#     experimental-cch-signing: false # optional: default is false; when true, sign the final /v1/messages body using the current Claude Code cch algorithm
#                                     # keep this disabled unless you explicitly need the behavior, so upstream seed changes fall back to legacy proxy behavior

# Default headers for Claude API requests. Update when Claude Code releases new versions.
# In legacy mode, user-agent/package-version/runtime-version/timeout are used as fallbacks
# when the client omits them, while OS/arch remain runtime-derived. When
# stabilize-device-profile is enabled, OS/arch stay pinned to the baseline values below,
# while user-agent/package-version/runtime-version seed a software fingerprint that can
# still upgrade to newer official Claude client versions.
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.44 (external, sdk-cli)"
#   package-version: "0.74.0"
#   runtime-version: "v24.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   stabilize-device-profile: false  # optional, default false; set true to enable per-auth/API-key fingerprint pinning

# Default headers for Codex OAuth model requests.
# With software identity enforcement enabled, `user-agent` is the canonical
# outbound identity even when a client sends its own value. Versions below
# 0.144.0 are upgraded only in outbound requests; the saved custom value is not
# modified. `beta-features` remains a client fallback for HTTP and websocket requests.
# They do not apply to codex-api-key entries.
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.146.0 (Mac OS 26.5.0; arm64) iTerm.app/3.6.10"
#   originator: "codex_cli_rs"
#   beta-features: "multi_agent"

# Provider-wide Codex behavior. Disabled by default.
# `identity-confuse` remaps identities already supplied by the client.
# `spoof-session-identity` fills missing session/thread/window/turn identities
# for Codex OAuth/file-backed credentials and keeps them stable across retries.
# `turn-state-policy` controls client X-Codex-Turn-State forwarding for Codex OAuth identities:
# `passthrough` keeps every state, `guard-cross-account` removes only known cross-account states,
# `same-account-only` keeps only states known to belong to the selected account, and `strip` removes all.
# Upstream response states are always recorded and returned to the client. The default is `guard-cross-account`.
# codex:
#   # Boolean, default false (missing/null also disable new Live work).
#   # Disabling blocks new sessions, client secrets and connections, cancels pending setup,
#   # and keeps established sessions and authenticated hangup/cleanup available.
#   live-enabled: false
#   # WebRTC media relay only; new sessions still require live-enabled.
#   # Changes apply to new sessions; established sessions retain their configuration.
#   live-media-relay:
#     enabled: false
#     # 0 inherits 32; otherwise 1..2147483647. Invalid values reject config saves.
#     max-sessions: 32
#     # Keep private downstream candidates usable for LAN clients by default.
#     disable-private-remote-ips: false
#     public-ip: "" # Optional advertised IP; no public address is inferred.
#     # Both 0 use OS allocation. Otherwise 1..65535, min <= max,
#     # with at least two ports per configured session.
#     udp-port-min: 0
#     udp-port-max: 0
#     # Optional STUN/TURN URLs; TURN entries require username and credential.
#     # These secrets are retained in YAML and omitted from config JSON responses.
#     ice-servers: []
#   identity-confuse: false
#   # Preserve explicit prompt_cache_key and Session-Id/session_id after all identity projections.
#   # A missing client Session ID uses the explicit cache key; other identity fields stay independent.
#   # Defaults to false. Without an explicit key, existing cache generation is unchanged.
#   # When enabled, a Session ID (including its cache-key fallback) containing surrounding whitespace
#   # or invalid HTTP header characters is rejected locally with HTTP 500 / invalid_prompt_cache_key.
#   # UUIDs and other valid strings pass unchanged. A valid independent Session ID permits any cache string.
#   # Hot updates affect the next request/WS turn, never its retries. Changed WS identities require reconnect
#   # and complete replay context; no additional retry budget is introduced.
#   passthrough-prompt-cache-key: false
#   # Buffer up to 16 pre-output metadata events / 64 KiB to detect overloads before
#   # committing the stream. Uses the existing retry budget and requires a replayable request.
#   stream-bootstrap-buffering: false
#   # Estimate text/tool input for the first empty Claude message_start usage when
#   # streaming through Codex. Boolean, off by default; invalid types are rejected.
#   # Adds CPU/allocation cost, excludes media, and never changes final upstream usage.
#   # Hot updates affect the next logical request; retries keep the numeric snapshot.
#   estimate-claude-input-tokens: false
#   # Observe quota headers and WebSocket quota events from actual Codex requests.
#   # Boolean, missing/null defaults to false; other types are rejected. No extra network query,
#   # credential persistence, routing or cooldown changes. Hot updates affect new
#   # logical requests; in-flight retries keep the original setting.
#   observe-quota: false
#   # Convert unpaired Codex app delegation results to user messages only for
#   # X-Openai-Subagent: collab_spawn. Paired calls and other tools are unchanged.
#   orphan-delegation-compatibility: false
#   # Opt into official Codex multi-agent v2 tool preparation and model descriptions.
#   # Defaults to false. Hot updates apply to the next logical request / WebSocket turn.
#   # Existing encrypted history remains opaque; other protocols cannot consume it.
#   optimize-multi-agent-v2: false
#   spoof-session-identity: false
#   turn-state-policy: "guard-cross-account"
#   enforce-software-identity: true # normalize outbound User-Agent, Originator, and Version; default true

# Optional Codex upstream fingerprinting. Disabled by default.
# `ja3` forces the observed native Codex TLS 1.2 ClientHello, HTTP/1.1,
# and Codex request header order. It is mutually exclusive with the
# HTTP/1.1-only options.
# `force-http1` forces all Codex HTTPS requests to use HTTP/1.1.
# `images-force-http1` only forces image_generation requests to use HTTP/1.1.
# `default-mode` is written only to future Codex credential uploads that omit
# `codex_fingerprint_mode`; existing credentials and explicit upload values are unchanged.
# `session-identity-pool-size` controls the persistent sticky Session pool used by
# `session` and `full` modes. `1` keeps one converged identity; valid range is 1-64.
# With routing affinity enabled, pool selection reuses its
# captured session identity across client API keys on the same account. Inferred
# LCP histories retain caller scope; resizing the pool recalculates assignment.
# Turn IDs remain unique per logical request regardless of this value.
# codex-fingerprint:
#   ja3: false
#   force-http1: false
#   images-force-http1: false
#   session-identity-pool-size: 1
#   default-mode: "device" # off, device, session, or full

# OpenAI compatibility providers
# openai-compatibility:
#   - name: "openrouter" # The name of the provider; it will be used in the user agent and other places.
#     disabled: false # optional: keep this provider saved but prevent it from being registered.
#     prefix: "test" # optional: require calls like "test/kimi-k2" to target this provider's credentials
#     base-url: "https://openrouter.ai/api/v1" # The base URL of the provider.
#     headers:
#       X-Custom-Header: "custom-value"
#     api-key-entries:
#       - api-key: "sk-or-v1-...b780"
#         proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#         # proxy-url: "direct" # optional: explicit direct connect for this credential
#       - api-key: "sk-or-v1-...b781" # without proxy-url
#     models: # The models supported by the provider.
#       - name: "moonshotai/kimi-k2:free" # The actual model name.
#         alias: "kimi-k2"               # The alias used in the API.
#         input-modalities: []          # optional: text/image/audio/video; omission/null/[] inherits the catalog.
#         # Explicit [text] flattens tool results and replaces their images with a text marker.
#         # Other lists only override advertised inputs; invalid/empty entries reject the config.
#         # Model selection snapshots the setting; in-flight attempts keep their selected policy.
#         thinking:                      # optional: omit to default to levels ["low","medium","high"]
#           levels: ["low", "medium", "high"]
#       # You may repeat the same alias to build an internal model pool.
#       # The client still sees only one alias in the model list.
#       # Requests to that alias will round-robin across the upstream names below,
#       # and if the chosen upstream fails before producing output, the request will
#       # continue with the next upstream model in the same alias pool.
#       - name: "deepseek-v3.1"
#         alias: "claude-opus-4.66"
#       - name: "glm-5"
#         alias: "claude-opus-4.66"
#       - name: "kimi-k2.5"
